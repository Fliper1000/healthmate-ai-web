<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthMate – ЗОЖ ассистент</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(to right, #f0f9ff, #d9f1e2);
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #ffffffcc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    header img {
      height: 60px;
    }
    .lang-switcher {
      font-size: 14px;
    }
    .container {
      padding: 40px;
      text-align: center;
    }
    h1 {
      font-size: 48px;
      color: #00796b;
    }
    p.description {
      font-size: 20px;
      margin-bottom: 30px;
    }
    .illustration {
      max-width: 600px;
      max-height: 400px;
      width: auto;
      height: auto;
      margin: 0 auto 40px auto;
      display: block;
      object-fit: cover;
    }
    .query-box {
      margin-top: 20px;
    }
    .query-box input {
      padding: 10px;
      width: 60%;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .query-box button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #00796b;
      color: white;
      border: none;
      border-radius: 6px;
      margin-left: 10px;
      cursor: pointer;
    }
    .response {
      margin-top: 20px;
      font-size: 18px;
      color: #004d40;
      background-color: #e0f2f1;
      padding: 20px;
      border-radius: 10px;
      display: none;
      text-align: left;
      max-width: 60%;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="HealthMate Logo" />
    <div class="lang-switcher">
      <select id="langSelect">
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>
  <div class="container">
    <h1 id="title">Добро пожаловать в HealthMate</h1>
    <p class="description" id="description">Ваш персональный помощник по здоровому образу жизни и благополучию.</p>
    <img class="illustration" src="https://images.unsplash.com/photo-1540206395-68808572332f" alt="Healthy Lifestyle" />
    <div class="query-box">
      <input type="text" id="userInput" placeholder="Введите ваш вопрос..." />
      <button id="askBtn">Спросить</button>
    </div>
    <div class="response" id="responseBox"></div>
  </div>

  <script>
    // Ваш OpenAI ключ (для продакшена перенесите на сервер или защищённый бэкенд!)
    const OPENAI_API_KEY = 'sk-...';

    const langSelect = document.getElementById('langSelect');
    const title = document.getElementById('title');
    const description = document.getElementById('description');
    const askBtn = document.getElementById('askBtn');
    const userInput = document.getElementById('userInput');
    const responseBox = document.getElementById('responseBox');

    const texts = {
      ru: {
        title: 'Добро пожаловать в HealthMate',
        description: 'Ваш персональный помощник по здоровому образу жизни и благополучию.',
        placeholder: 'Введите ваш вопрос...',
        button: 'Спросить',
      },
      en: {
        title: 'Welcome to HealthMate',
        description: 'Your personal assistant for a healthy lifestyle and well-being.',
        placeholder: 'Type your question...',
        button: 'Ask',
      }
    };

    // Переключение языка интерфейса
    langSelect.addEventListener('change', () => {
      const lang = langSelect.value;
      title.textContent = texts[lang].title;
      description.textContent = texts[lang].description;
      userInput.placeholder = texts[lang].placeholder;
      askBtn.textContent = texts[lang].button;
      responseBox.style.display = 'none';
    });

    // Обработка клика кнопки
    askBtn.addEventListener('click', async () => {
      const prompt = userInput.value.trim();
      if (!prompt) return;
      responseBox.textContent = 'Отправка запроса...';
      responseBox.style.display = 'block';

      try {
        const res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: 'gpt-3.5-turbo',
            messages: [
              { role: 'system', content: 'You are a helpful assistant.' },
              { role: 'user', content: prompt }
            ]
          })
        });
        const data = await res.json();
        const answer = data.choices?.[0]?.message?.content || 'Нет ответа.';
        responseBox.textContent = answer;
      } catch (err) {
        responseBox.textContent = 'Ошибка при получении ответа.';
      }
    });
  </script>
</body>
</html>
