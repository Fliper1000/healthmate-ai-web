<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthMate – ЗОЖ ассистент</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(to right, #f0f9ff, #d9f1e2);
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #ffffffcc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    header img {
      height: 60px;
    }
    .lang-switcher {
      font-size: 14px;
    }
    .container {
      padding: 40px;
      text-align: center;
    }
    h1 {
      font-size: 48px;
      color: #00796b;
    }
    p {
      font-size: 20px;
      margin-bottom: 30px;
    }
    .illustration {
      max-width: 600px;
      max-height: 400px;
      width: auto;
      height: auto;
      margin: 0 auto 40px auto;
      display: block;
      object-fit: cover;
    }
    .query-box {
      margin-top: 20px;
    }
    .query-box input {
      padding: 10px;
      width: 60%;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .query-box button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #00796b;
      color: white;
      border: none;
      border-radius: 6px;
      margin-left: 10px;
      cursor: pointer;
    }
    .response {
      margin-top: 20px;
      font-size: 18px;
      color: #004d40;
      background-color: #e0f2f1;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="HealthMate Logo" />
    <div class="lang-switcher">
      <select id="languageSwitcher" onchange="changeLanguage()">
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>
  <div class="container">
    <h1 id="mainTitle">Добро пожаловать в HealthMate</h1>
    <p id="description">Ваш персональный помощник по здоровому образу жизни и благополучию.</p>
    <img class="illustration" src="https://images.unsplash.com/photo-1540206395-68808572332f" alt="Healthy Lifestyle" />
    <div class="query-box">
      <input type="text" id="userQuery" placeholder="Введите ваш вопрос..." />
      <button onclick="askQuestion()" id="askButton">Спросить</button>
    </div>
    <div class="response" id="responseBox">
      Ответ появится здесь.
    </div>
  </div>
  <script>
    const API_KEY = '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';

    const translations = {
      ru: {
        mainTitle: 'Добро пожаловать в HealthMate',
        description: 'Ваш персональный помощник по здоровому образу жизни и благополучию.',
        placeholder: 'Введите ваш вопрос...',
        buttonText: 'Спросить',
        responseText: 'Ответ появится здесь.'
      },
      en: {
        mainTitle: 'Welcome to HealthMate',
        description: 'Your personal assistant for a healthy lifestyle and well-being.',
        placeholder: 'Enter your question...',
        buttonText: 'Ask',
        responseText: 'The answer will appear here.'
      }
    };

    function changeLanguage() {
      const lang = document.getElementById('languageSwitcher').value;
      document.getElementById('mainTitle').innerText = translations[lang].mainTitle;
      document.getElementById('description').innerText = translations[lang].description;
      document.getElementById('userQuery').placeholder = translations[lang].placeholder;
      document.getElementById('askButton').innerText = translations[lang].buttonText;
      document.getElementById('responseBox').innerText = translations[lang].responseText;
    }

    async function askQuestion() {
      const userQuery = document.getElementById('userQuery').value;
      if (!userQuery) {
        alert('Пожалуйста, введите вопрос!');
        return;
      }
      document.getElementById('responseBox').style.display = 'block';
      document.getElementById('responseBox').innerText = 'Загрузка ответа...';

      try {
        const res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'gpt-3.5-turbo',
            messages: [
              { role: 'system', content: 'You are a helpful assistant.' },
              { role: 'user', content: userQuery }
            ]
          })
        });
        const data = await res.json();
        const answer = data.choices[0].message.content.trim();
        document.getElementById('responseBox').innerText = answer;
      } catch (error) {
        document.getElementById('responseBox').innerText = 'Ошибка при получении ответа.';
        console.error(error);
      }
    }
  </script>
</body>
</html>
